<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="OHAYO! — worker condition recording system" />
    <title>OHAYO!</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <span id="brand-title">OHAYO!</span>
      </div>
      <div class="header-right">
        <span id="net-label" class="net-label"></span>
        <label class="lang">
          <span class="visually-hidden" id="lang-label">Language</span>
          <select id="lang-select">
            <option value="ja">日本語</option>
            <option value="en">English</option>
          </select>
        </label>
        <button type="button" id="logout" class="link-btn" hidden></button>
      </div>
    </header>

    <nav id="nav" class="app-nav" hidden></nav>

    <main id="view" class="view" aria-live="polite"></main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
